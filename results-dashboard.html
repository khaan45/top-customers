<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Election Results Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  body {
    font-family: Arial, sans-serif;
    max-width: 900px;
    margin: 40px auto;
    color: #222;
    background: #fafafa;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .subtitle { color: #666; margin-bottom: 24px; }
  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 28px;
  }
  .stat-card {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    padding: 16px;
  }
  .stat-label { font-size: 13px; color: #666; margin-bottom: 4px; }
  .stat-value { font-size: 26px; font-weight: bold; }
  .chart-wrap {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 24px;
  }
  .chart-title { font-size: 14px; color: #444; margin-bottom: 12px; font-weight: bold; }
  #resultsCanvasWrap, #trendCanvasWrap { position: relative; width: 100%; height: 280px; }
  .refresh-note { font-size: 12px; color: #999; text-align: right; }
  .error { color: #b00020; padding: 12px; background: #fdecea; border-radius: 6px; }
</style>
</head>
<body>

  <h1>Election Results</h1>
  <p class="subtitle">Live tallies — auto-refreshes every 15 seconds</p>

  <div id="error-box"></div>

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-label">Votes cast</div>
      <div class="stat-value" id="stat-voted">–</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Total students</div>
      <div class="stat-value" id="stat-total">–</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Turnout</div>
      <div class="stat-value" id="stat-turnout">–</div>
    </div>
  </div>

  <div class="chart-wrap">
    <div class="chart-title">Votes by candidate</div>
    <div id="resultsCanvasWrap">
      <canvas id="resultsChart" role="img" aria-label="Bar chart of vote counts per candidate"></canvas>
    </div>
  </div>

  <div class="chart-wrap">
    <div class="chart-title">Votes over time</div>
    <div id="trendCanvasWrap">
      <canvas id="trendChart" role="img" aria-label="Line chart of votes cast per hour"></canvas>
    </div>
  </div>

  <p class="refresh-note" id="last-updated"></p>

<script>
  const RESULTS_ENDPOINT = "/api/admin/results"; // adjust if hosted elsewhere
  let resultsChart, trendChart;

  async function loadResults() {
    try {
      const res = await fetch(RESULTS_ENDPOINT, { credentials: "include" });
      if (!res.ok) throw new Error("Request failed: " + res.status);
      const data = await res.json();
      render(data);
      document.getElementById("error-box").innerHTML = "";
    } catch (err) {
      document.getElementById("error-box").innerHTML =
        '<div class="error">Could not load results: ' + err.message + "</div>";
    }
  }

  function render(data) {
    const { results, turnout, trend } = data;

    document.getElementById("stat-voted").textContent = turnout.votedCount.toLocaleString();
    document.getElementById("stat-total").textContent = turnout.totalStudents.toLocaleString();
    document.getElementById("stat-turnout").textContent = turnout.turnoutPercentage + "%";

    const labels = results.map((r) => r.candidateId);
    const counts = results.map((r) => r.voteCount);

    if (!resultsChart) {
      resultsChart = new Chart(document.getElementById("resultsChart"), {
        type: "bar",
        data: { labels, datasets: [{ label: "Votes", data: counts, backgroundColor: "#2a78d6", borderRadius: 4 }] },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true } },
        },
      });
    } else {
      resultsChart.data.labels = labels;
      resultsChart.data.datasets[0].data = counts;
      resultsChart.update();
    }

    const trendLabels = trend.map((t) => new Date(t.hour).toLocaleString());
    const trendCounts = trend.map((t) => t.count);

    if (!trendChart) {
      trendChart = new Chart(document.getElementById("trendChart"), {
        type: "line",
        data: {
          labels: trendLabels,
          datasets: [{ label: "Votes", data: trendCounts, borderColor: "#1baf7a", backgroundColor: "rgba(27,175,122,0.1)", fill: true, tension: 0.2 }],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true } },
        },
      });
    } else {
      trendChart.data.labels = trendLabels;
      trendChart.data.datasets[0].data = trendCounts;
      trendChart.update();
    }

    document.getElementById("last-updated").textContent =
      "Last updated: " + new Date().toLocaleTimeString();
  }

  loadResults();
  setInterval(loadResults, 15000);
</script>
</body>
</html>
